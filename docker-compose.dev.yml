# Dev mode overlay. Used together with docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -d
#
# Replaces the production bot image with a dev image that bind-mounts source
# and runs `node --watch`, adds a `web` service running the Vite dev server
# on :5173 with HMR, and wires the DEV-ONLY ComfyUI provider:
#
#   ComfyUI runs on Windows (127.0.0.1:8188). Under WSL2 mirrored networking
#   (+ hostAddressLoopback) that port answers on the WSL host's loopback only —
#   never on the LAN address — and a bridge-networked container's 127.0.0.1 is
#   its own. `comfy-bridge` (socat, host network namespace) listens on :18188
#   on every WSL-host interface and forwards to 127.0.0.1:8188; the bot reaches
#   it through host.docker.internal (docker0's host-gateway address). Inside
#   the bot container a second socat (started by the `command` below) forwards
#   127.0.0.1:8188 → host.docker.internal:18188, because comfy-cli's
#   validate / set_workflow_slot / local_check tools always talk to the LOCAL
#   127.0.0.1:8188 regardless of COMFYUI_URL — with the forward in place they
#   see the Windows ComfyUI and local_check becomes a real verdict. The bot
#   container itself runs comfy-mcp (Dockerfile.dev), so upload_file paths are
#   container paths as required. Production never sets COMFYUI_URL: the SPA and
#   the agent say "ComfyUI rendering is disabled on this server" and fal.ai
#   stays available.
#
#   Alternatives if the bridge misbehaves: `network_mode: host` for bot + web
#   (then Mongo must publish a non-27017 port and VITE_API_TARGET changes), or
#   start ComfyUI with `--listen 0.0.0.0` and open the Windows firewall, then
#   point COMFYUI_URL at the LAN address directly (no bridge needed).
services:
  comfy-bridge:
    image: alpine/socat
    network_mode: host
    restart: unless-stopped
    command: ["TCP-LISTEN:18188,fork,reuseaddr", "TCP:127.0.0.1:8188"]

  bot:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: screenplay-bot-dev
    command:
      - sh
      - -c
      - "socat TCP-LISTEN:8188,fork,reuseaddr TCP:host.docker.internal:18188 & exec node --watch src/index.js"
    volumes:
      # Bind-mount the project so file edits propagate. node_modules is kept
      # in a named volume so the container's npm-installed deps aren't
      # shadowed by anything that might exist on the host.
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./web:/app/web
      - ./tests:/app/tests
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./vitest.config.js:/app/vitest.config.js
      - bot-node-modules:/app/node_modules
      - exports:/data/exports
      - ./backups:/data/backups
    environment:
      MONGO_URI: mongodb://mongo:27017
      CHROMA_URL: http://chroma:8000
      BACKUP_DIR: /data/backups
      # Tell the SPA where to open its WebSocket. Browser is on the host,
      # so it points at the host-mapped Hocuspocus port.
      WEB_PUBLIC_BASE_URL: http://localhost:3000
      # ComfyUI on the Windows side, through the in-container forward → the
      # host bridge. compose `environment` wins over `.env`, so this is the dev
      # stack's value even when .env leaves it unset (prod). Comment out to run
      # without ComfyUI.
      COMFYUI_URL: http://127.0.0.1:8188
      COMFY_WORK_DIR: /tmp/screenplay-comfy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: screenplay-bot-dev
    command:
      - npx
      - vite
      - --config
      - web/vite.config.js
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app/web
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - bot-node-modules:/app/node_modules
    environment:
      VITE_API_TARGET: http://bot:3000
    depends_on:
      - bot

volumes:
  bot-node-modules:
